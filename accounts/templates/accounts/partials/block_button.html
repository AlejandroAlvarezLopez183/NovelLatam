<div id="block-btn-{{ author.id }}" class="flex items-center gap-3">
    <button hx-post="{% url 'accounts:toggle_block' author.username %}"
            hx-target="#block-btn-{{ author.id }}"
            hx-swap="outerHTML"
            class="inline-flex items-center gap-2 font-bold px-4 py-2 rounded-full text-sm transition-all duration-200
                   {% if is_blocked %}
                   text-red-400 hover:text-white bg-red-900/30 hover:bg-red-500/50 border border-red-500/50
                   {% else %}
                   text-gray-400 hover:text-red-400 bg-gray-800 hover:bg-gray-700 border border-gray-600
                   {% endif %}">
        {% if is_blocked %}
            Desbloquear
        {% else %}
            Bloquear
        {% endif %}
    </button>
</div>
