{% load static %}
<button hx-post="{% url 'comments:toggle_like' comment.id %}"
        hx-target="#like-btn-{{ comment.id }}"
        hx-swap="outerHTML"
        id="like-btn-{{ comment.id }}"
        class="flex items-center gap-1 text-xs transition-colors focus:outline-none {% if is_liked %}text-red-400 hover:text-red-300{% else %}text-purple-500 hover:text-red-400{% endif %}"
        aria-label="{% if is_liked %}Quitar like{% else %}Dar like{% endif %}">
    <svg class="w-3.5 h-3.5" fill="{% if is_liked %}currentColor{% else %}none{% endif %}" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
    </svg>
    <span>{{ comment.likes_count }}</span>
</button>
