{% load static %}
{% if user.is_authenticated and user != author %}
<button hx-post="{% url 'reading:toggle_support' author.username %}"
        hx-target="#support-button-container"
        hx-swap="innerHTML"
        id="btn-apoyar-{{ author.username }}"
        class="flex items-center gap-2 font-bold px-4 py-2 rounded-full text-sm transition-all duration-200 hover:scale-105
               {% if is_supporting %}
               text-white
               {% else %}
               text-purple-300 hover:text-white
               {% endif %}"
        style="{% if is_supporting %}
               background:linear-gradient(135deg,#9333EA,#7C3AED);box-shadow:0 4px 16px rgba(147,51,234,.4);
               {% else %}
               border:1px solid rgba(124,58,237,.45);background:rgba(124,58,237,.12);
               {% endif %}">
    <span class="text-base">{% if is_supporting %}💜{% else %}🤍{% endif %}</span>
    {% if is_supporting %}Apoyando{% else %}Apoyar{% endif %}
    <span class="ml-1 font-extrabold">{{ supports_count }}</span>
</button>
{% elif user.is_authenticated and user == author %}
{# El autor ve sus apoyos pero no puede apoyarse a sí mismo #}
<span class="flex items-center gap-1.5 text-sm font-semibold text-purple-400 px-3 py-1.5 rounded-full"
      style="border:1px solid rgba(124,58,237,.25);background:rgba(124,58,237,.08);">
    💜 {{ supports_count }} apoyos recibidos
</span>
{% else %}
<a href="{% url 'accounts:login' %}"
   class="flex items-center gap-2 text-purple-300 hover:text-white font-bold px-4 py-2 rounded-full text-sm transition-all"
   style="border:1px solid rgba(124,58,237,.35);background:rgba(124,58,237,.1);">
    🤍 Apoyar
</a>
{% endif %}
