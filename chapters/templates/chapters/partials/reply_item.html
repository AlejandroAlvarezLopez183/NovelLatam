<div class="reply-item flex items-start gap-2 py-2" id="reply-{{ reply.id }}">
    <div class="w-7 h-7 rounded-full bg-brand-dark flex items-center justify-center font-bold text-xs flex-shrink-0">
        {{ reply.author.username|first|upper }}
    </div>
    <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-0.5">
            <a href="{% url 'accounts:author_profile' reply.author.username %}"
               class="text-xs font-bold text-white hover:text-brand-light transition-colors">
                {{ reply.author.username }}
            </a>
            <span class="text-xs text-purple-600">· {{ reply.created_at|timesince }}</span>
        </div>
        <p class="text-xs text-purple-200 leading-relaxed">{{ reply.body }}</p>

        {# Acciones: Like y Responder en respuesta #}
        {% if user.is_authenticated %}
        <div class="flex items-center gap-4 mt-1">
            <button hx-post="{% url 'comments:toggle_like' reply.id %}"
                    hx-target="#like-btn-reply-{{ reply.id }}"
                    hx-swap="outerHTML"
                    id="like-btn-reply-{{ reply.id }}"
                    class="flex items-center gap-1 text-xs text-purple-600 hover:text-red-400 transition-colors focus:outline-none"
                    aria-label="Dar like a respuesta">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                </svg>
                <span>{{ reply.likes_count }}</span>
            </button>

            <button @click="replyOpen = true; $nextTick(() => { let el = document.getElementById('reply-input-{{ reply.parent_id }}'); let tag = '@{{ reply.author.username }} '; if (!el.value.includes(tag)) { el.value = tag + el.value; } el.focus(); })"
                    class="flex items-center gap-1 text-xs text-purple-600 hover:text-brand-light transition-colors focus:outline-none"
                    aria-label="Responder a este usuario">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
                </svg>
                Responder
            </button>

            {# Botón de borrar respuesta #}
            {% if user == reply.author %}
            <button hx-post="{% url 'comments:delete_comment' reply.id %}"
                    hx-target="#reply-{{ reply.id }}"
                    hx-swap="outerHTML"
                    hx-confirm="¿Seguro que quieres eliminar esta respuesta?"
                    class="text-xs text-red-500 hover:text-red-400 transition-colors flex items-center gap-1 ml-auto"
                    aria-label="Eliminar respuesta">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
            {% endif %}
        </div>
        {% endif %}
    </div>
</div>
